<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — StayFinder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
</head>
<body class="auth-body">

    <div class="auth-container">
        <a href="{{ url_for('home') }}" class="auth-logo">StayFinder</a>

        <div class="auth-card">
            <h2>Sign In</h2>
            <p class="auth-sub">Welcome back! Please enter your details.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('signin') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <p class="auth-switch">
                New to StayFinder? <a href="{{ url_for('signup') }}">Create an account</a>
            </p>
        </div>

        <a href="{{ url_for('home') }}" class="auth-back">← Back to Home</a>
    </div>

</body>
</html>
